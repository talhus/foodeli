basePath: /api/v1
definitions:
  auth.AuthResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/auth.UserResponse'
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      role:
        type: string
    required:
    - email
    - password
    - role
    type: object
  auth.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
  auth.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      role:
        type: string
    type: object
  cart.AddToCartRequest:
    properties:
      force:
        description: If true and cart has items from another store, clears old cart
        type: boolean
      product_id:
        type: string
      quantity:
        type: integer
      store_id:
        type: string
    required:
    - product_id
    - quantity
    - store_id
    type: object
  cart.Cart:
    properties:
      item_count:
        description: sum of quantities
        type: integer
      items:
        items:
          $ref: '#/definitions/cart.CartItem'
        type: array
      store_id:
        description: nil if cart is empty
        type: string
      store_name:
        type: string
      total_amount:
        description: minor units (cents)
        type: integer
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  cart.CartItem:
    properties:
      product_id:
        type: string
      product_name:
        type: string
      quantity:
        type: integer
      subtotal:
        description: unit_price * quantity
        type: integer
      unit_price:
        description: minor units (cents)
        type: integer
    type: object
  cart.CheckoutRequest:
    properties:
      delivery_address:
        minLength: 5
        type: string
    required:
    - delivery_address
    type: object
  cart.UpdateCartItemRequest:
    properties:
      quantity:
        type: integer
    required:
    - quantity
    type: object
  order.CreateOrderRequest:
    properties:
      delivery_address:
        maxLength: 500
        minLength: 5
        type: string
      items:
        items:
          $ref: '#/definitions/order.OrderItemRequest'
        minItems: 1
        type: array
      store_id:
        type: string
    required:
    - delivery_address
    - items
    - store_id
    type: object
  order.Order:
    properties:
      created_at:
        type: string
      delivery_address:
        type: string
      id:
        type: string
      idempotency_key:
        type: string
      items:
        items:
          $ref: '#/definitions/order.OrderItem'
        type: array
      status:
        type: string
      store_id:
        type: string
      total_amount:
        description: minor units (cents)
        type: integer
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  order.OrderItem:
    properties:
      created_at:
        type: string
      id:
        type: string
      order_id:
        type: string
      product_id:
        type: string
      product_name:
        type: string
      quantity:
        type: integer
      subtotal:
        type: integer
      unit_price:
        type: integer
    type: object
  order.OrderItemRequest:
    properties:
      product_id:
        type: string
      quantity:
        type: integer
    required:
    - product_id
    - quantity
    type: object
  order.UpdateOrderStatusRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  payment.CheckoutSessionResponse:
    properties:
      checkout_url:
        type: string
      expires_at:
        type: string
      session_id:
        type: string
      status:
        type: string
    type: object
  payment.CreateCheckoutSessionRequest:
    properties:
      order_id:
        type: string
    required:
    - order_id
    type: object
  payment.Payment:
    properties:
      amount:
        type: integer
      created_at:
        type: string
      currency:
        type: string
      failure_reason:
        type: string
      id:
        type: string
      order_id:
        type: string
      payment_method:
        type: string
      provider:
        type: string
      status:
        type: string
      transaction_id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  payment.ProcessPaymentRequest:
    properties:
      card_holder_name:
        maxLength: 100
        minLength: 2
        type: string
      card_number:
        maxLength: 16
        minLength: 16
        type: string
      cvv:
        maxLength: 4
        minLength: 3
        type: string
      expire_month:
        maxLength: 2
        minLength: 2
        type: string
      expire_year:
        maxLength: 4
        minLength: 2
        type: string
      order_id:
        type: string
      payment_method:
        type: string
      provider:
        type: string
    required:
    - card_holder_name
    - card_number
    - cvv
    - expire_month
    - expire_year
    - order_id
    - payment_method
    type: object
  payment.TyrFintechWebhookPayload:
    properties:
      amount:
        type: integer
      currency:
        type: string
      event:
        type: string
      order_id:
        type: string
      session_id:
        type: string
      status:
        type: string
      timestamp:
        type: integer
      transaction_id:
        type: string
    required:
    - amount
    - event
    - order_id
    - status
    - transaction_id
    type: object
  product.CreateProductRequest:
    properties:
      description:
        maxLength: 1000
        minLength: 2
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      price:
        type: integer
      stock:
        type: integer
    required:
    - description
    - name
    - price
    - stock
    type: object
  product.Product:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      price:
        type: integer
      stock:
        type: integer
      store_id:
        type: string
      updated_at:
        type: string
    type: object
  product.UpdateProductRequest:
    properties:
      description:
        maxLength: 1000
        minLength: 2
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      price:
        type: integer
      stock:
        type: integer
    type: object
  response.APIError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  response.Response:
    properties:
      data: {}
      error:
        $ref: '#/definitions/response.APIError'
      success:
        type: boolean
    type: object
  store.CreateMenuItemRequest:
    properties:
      description:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      price:
        type: number
    required:
    - name
    - price
    type: object
  store.CreateStoreRequest:
    properties:
      address:
        minLength: 3
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - address
    - name
    type: object
  store.MenuItem:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      price:
        type: number
      store_id:
        type: string
      updated_at:
        type: string
    type: object
  store.Store:
    properties:
      address:
        type: string
      created_at:
        type: string
      id:
        type: string
      merchant_id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Foodeli Engineering
    url: https://github.com/iamtbay/foodeli
  description: High-performance Modular Monolith backend for food & marketplace delivery
    platform.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Foodeli Core API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and issue JWT accessToken cookie and bearer token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: Login user
      tags:
      - Auth
  /auth/logout:
    post:
      description: Clear authentication session cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: Logout user
      tags:
      - Auth
  /auth/me:
    get:
      description: Retrieve profile of currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.User'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get authenticated user profile
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new customer or merchant account
      parameters:
      - description: Registration credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Response'
      summary: Register a new user
      tags:
      - Auth
  /cart:
    delete:
      description: Empty all items in customer's cart
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Clear active cart
      tags:
      - Cart
    get:
      description: Retrieve customer's active shopping cart stored in Redis
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/cart.Cart'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get customer shopping cart
      tags:
      - Cart
  /cart/checkout:
    post:
      consumes:
      - application/json
      description: Convert active cart into a confirmed pending order and atomic stock
        reservation
      parameters:
      - description: Idempotency key UUID
        in: header
        name: Idempotency-Key
        type: string
      - description: Checkout payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cart.CheckoutRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/order.Order'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Checkout cart to create order
      tags:
      - Cart
  /cart/items:
    post:
      consumes:
      - application/json
      description: Add a product with quantity to cart (enforces single-store cart
        unless force=true)
      parameters:
      - description: Add to cart payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cart.AddToCartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/cart.Cart'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Add item to cart
      tags:
      - Cart
  /cart/items/{productId}:
    delete:
      description: Remove a specific product from customer's cart
      parameters:
      - description: Product UUID
        in: path
        name: productId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/cart.Cart'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Remove item from cart
      tags:
      - Cart
    put:
      consumes:
      - application/json
      description: Modify the quantity of a product in the cart
      parameters:
      - description: Product UUID
        in: path
        name: productId
        required: true
        type: string
      - description: Update quantity payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cart.UpdateCartItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/cart.Cart'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Update cart item quantity
      tags:
      - Cart
  /orders:
    post:
      consumes:
      - application/json
      description: Place an order directly with items and address
      parameters:
      - description: Idempotency key UUID
        in: header
        name: Idempotency-Key
        type: string
      - description: Create order payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/order.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/order.Order'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Create an order directly
      tags:
      - Orders
  /orders/{id}:
    get:
      description: Retrieve order details by ID for owner customer or store merchant
      parameters:
      - description: Order UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/order.Order'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get order by ID
      tags:
      - Orders
  /orders/{id}/status:
    patch:
      consumes:
      - application/json
      description: Transition order status (PENDING -> CONFIRMED -> PREPARING -> DELIVERED
        or CANCELLED)
      parameters:
      - description: Order UUID
        in: path
        name: id
        required: true
        type: string
      - description: Order status payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/order.UpdateOrderStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/order.Order'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Update order status
      tags:
      - Orders
  /orders/customer/mine:
    get:
      description: Retrieve order history for the authenticated customer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/order.Order'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: List customer orders
      tags:
      - Orders
  /orders/merchant/mine:
    get:
      description: Retrieve all incoming orders for the merchant's store
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/order.Order'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: List merchant orders
      tags:
      - Orders
  /payments/checkout-session:
    post:
      consumes:
      - application/json
      description: Initiate a TyrFintech hosted checkout session for wallet or external
        payment
      parameters:
      - description: Checkout session payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/payment.CreateCheckoutSessionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/payment.CheckoutSessionResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Create hosted checkout session
      tags:
      - Payments
  /payments/order/{orderId}:
    get:
      description: Retrieve payment receipt details for an order
      parameters:
      - description: Order UUID
        in: path
        name: orderId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/payment.Payment'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get payment by order ID
      tags:
      - Payments
  /payments/process:
    post:
      consumes:
      - application/json
      description: Process direct credit card payment for an order via TyrFintech
      parameters:
      - description: Payment payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/payment.ProcessPaymentRequest'
